name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/screenmirror.keystore"
      - name: Verify restored keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "=== Keystore file information ==="
          ls -lh "$RUNNER_TEMP/screenmirror.keystore"
          echo "=== Keystore SHA-256 ==="
          sha256sum "$RUNNER_TEMP/screenmirror.keystore"
          echo "=== Verifying keystore ==="
          keytool -list \
            -keystore "$RUNNER_TEMP/screenmirror.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias screenmirror
          echo "=== Keystore verification succeeded ==="
      - name: Build Debug APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/screenmirror.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMirror-debug
          path: app/build/outputs/apk/debug/app-debug.apk
